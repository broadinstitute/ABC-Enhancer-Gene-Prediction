name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-activate-base: true

      - name: Run linter (black)
        shell: bash -l {0}
        run: |
          mamba install -y black
          black . --check

      - name: Install abc-env
        shell: bash -l {0}
        run: mamba env create -f workflow/envs/abcenv.yml

      - name: Run tests
        shell: bash -l {0}
        run: conda run -n abc-env pytest -n 4

      - name: Slack notify on failure
        if: failure() && (env.CI_BRANCH == 'main' || env.CI_BRANCH == 'dev')
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "❌ ABC CI failed on `${{ env.CI_BRANCH }}`: ${{ github.event.head_commit.message || github.event.pull_request.title }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Slack notify on success
        if: success() && (env.CI_BRANCH == 'main' || env.CI_BRANCH == 'dev')
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ ABC CI passed on `${{ env.CI_BRANCH }}`: ${{ github.event.head_commit.message || github.event.pull_request.title }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
